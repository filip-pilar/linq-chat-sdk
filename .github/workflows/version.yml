name: Version

# Opens and maintains a "Version Packages" PR from the changesets on main.
#
# This workflow deliberately does NOT publish. changesets/action spawns the
# publish command as a child process and does not pass the OIDC request token
# through to it, so `npm publish` sees no credentials and fails ENEEDAUTH
# (npm/cli#8976). Publishing stays in publish.yml, which runs `npm publish` as a
# top-level step and inherits the OIDC environment cleanly.
#
# Merging the Version Packages PR edits packages/adapter-linq/package.json,
# which is what publish.yml triggers on. See RELEASING.md.

on:
  push:
    branches: [main]

concurrency:
  group: version-packages
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
